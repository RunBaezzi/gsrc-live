  .logo img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
  .logo .dot{position:absolute;width:5.23%;aspect-ratio:1;border-radius:50%;background:var(--gold);transform:translate(-50%,-50%)}
  .logo .d1{left:47.64%;top:12.68%}
  .logo .d2{left:13.55%;top:49.3%}

  .splash .logo .d1{opacity:0;animation:dotDrop .75s cubic-bezier(.3,1.5,.5,1) 1.0s forwards}
  .splash .logo .d2{opacity:0;animation:dotPop .6s cubic-bezier(.3,1.6,.5,1) 1.2s forwards}
  .splash .logo .dot{box-shadow:0 0 0 0 rgba(240,180,60,0)}

  /* ───── 지도 ───── */

  .brand{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:999px;padding:7px 14px 7px 7px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:0}
  .brand-badge{background:var(--ink);color:var(--volt);font-family:var(--num);font-weight:800;font-style:italic;font-size:15px;letter-spacing:.02em;padding:5px 9px;border-radius:999px;line-height:1;flex:0 0 auto}

  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,184,74,.5)}70%{box-shadow:0 0 0 7px rgba(0,184,74,0)}100%{box-shadow:0 0 0 0 rgba(0,184,74,0)}}
  .round-btn{width:42px;height:42px;border-radius:50%;background:var(--bg);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(0,0,0,.18)}

  .top-actions{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}

  .follow-pill{position:fixed;left:50%;top:calc(var(--top) + 58px);transform:translateX(-50%);z-index:1000;display:none;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:999px;padding:7px 7px 7px 14px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.3);white-space:nowrap}

  .follow-pill button{background:rgba(255,255,255,.14);color:#fff;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px}

  /* 완주 축하 배너 */
  /* ───── 응원 채팅 ───── */
  [hidden]{display:none!important}
  .chat-fab{position:fixed;z-index:1150;right:14px;bottom:calc(var(--sheet-vis,200px) + 14px);width:54px;height:54px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:bottom .32s cubic-bezier(.2,.8,.2,1)}

  .chat{position:fixed;z-index:1400;left:0;right:0;bottom:0;top:calc(var(--top) + 4px);background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);overflow:hidden}
  .chat.open{transform:none}
  .chat-head{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
  .chat-head .ct{flex:1;min-width:0}
  .chat-head .ct b{font-size:16px;font-weight:800;display:block}
  .chat-head .ct span{font-size:11px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:5px}
  .chat-head .ct i{width:7px;height:7px;border-radius:50%;background:var(--wait);display:inline-block}
  .chat-head .ct i.on{background:var(--run)}
  .chat-nick{font-size:12px;font-weight:800;background:var(--soft);padding:6px 10px;border-radius:999px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chat-x{width:34px;height:34px;border-radius:50%;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .chat-msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:#FAFAFA}
  .msg{max-width:80%;display:flex;flex-direction:column;gap:2px;align-self:flex-start}
  .msg .mn{font-size:11px;font-weight:800;color:var(--ink2);padding-left:4px}
  .msg .mb{background:#fff;border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:8px 11px;font-size:14px;line-height:1.45;word-break:break-word;white-space:pre-wrap}
  .msg .mt{font-size:10px;color:var(--ink3);padding-left:4px}
  .msg.me{align-self:flex-end;align-items:flex-end}
  .msg.me .mn{display:none}
  .msg.me .mb{background:var(--ink);color:#fff;border-color:var(--ink);border-radius:16px 4px 16px 16px}
  .msg.me .mt{padding-right:4px}
  .msg.pending{opacity:.55}
  .chat-empty{margin:auto;text-align:center;color:var(--ink3);font-size:13px;font-weight:600;line-height:1.7}
  .chat-quick{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 0;scrollbar-width:none}
  .chat-quick::-webkit-scrollbar{display:none}
  .chat-quick button{flex:0 0 auto;font-size:13px;font-weight:700;background:var(--soft);padding:7px 11px;border-radius:999px;white-space:nowrap}
  .chat-input{display:flex;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
  .chat-input input{flex:1;min-width:0;height:44px;border-radius:999px;border:0;background:var(--soft);padding:0 16px;font-size:16px;font-family:var(--sans);outline:none}
  .chat-input button{height:44px;padding:0 18px;border-radius:999px;background:var(--volt);color:var(--ink);font-size:15px;font-weight:800;flex:0 0 auto}
  .chat-input button:disabled{opacity:.5}
  .chat-gate{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:24px;text-align:center}
  .chat-gate h3{font-size:20px;font-weight:800}
  .chat-gate p{font-size:13px;color:var(--ink2);font-weight:600;line-height:1.6}
  .chat-gate input{width:min(280px,100%);height:48px;border-radius:14px;border:1.5px solid var(--line);padding:0 14px;font-size:16px;font-family:var(--sans);text-align:center;outline:none}
  .chat-gate input:focus{border-color:var(--ink)}
  .chat-gate button{width:min(280px,100%);height:48px;border-radius:999px;background:var(--ink);color:#fff;font-size:15px;font-weight:800}
  .chat-note{font-size:10px;color:var(--ink3);text-align:center;padding:4px 0 0}
  @media (min-width:900px){

  }
  .celeb{position:fixed;left:50%;top:calc(var(--top) + 58px);z-index:1300;width:min(calc(100vw - 24px),440px);transform:translate(-50%,-140%);opacity:0;transition:transform .45s cubic-bezier(.2,1.3,.4,1),opacity .3s;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:linear-gradient(120deg,#111 0%,#1d1d1d 60%,#2a2400 100%);color:#fff;box-shadow:0 14px 34px rgba(0,0,0,.35),0 0 0 2px var(--volt) inset;cursor:pointer}
  .celeb.show{transform:translate(-50%,0);opacity:1}
  .celeb .cb-e{font-size:30px;line-height:1;animation:cbPop .9s ease infinite alternate}
  .celeb .cb-t{flex:1;min-width:0;font-size:14px;font-weight:700;line-height:1.4;letter-spacing:-.01em}
  .celeb .cb-t b{color:var(--volt);font-weight:800}
  .celeb .cb-t small{display:block;font-size:11px;font-weight:600;color:#9A9AA0;margin-top:1px}
  .celeb .cb-x{color:#9A9AA0;font-size:18px;padding:0 2px}
  @keyframes cbPop{from{transform:scale(1) rotate(-6deg)}to{transform:scale(1.15) rotate(6deg)}}
  .confetti{position:fixed;top:-40px;z-index:1250;pointer-events:none;font-size:22px;animation:fall 2.4s cubic-bezier(.3,.6,.5,1) forwards}
  @keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),70vh) rotate(var(--rot));opacity:0}}

  .toast{position:fixed;left:50%;bottom:calc(var(--sheet-vis,200px) + 16px);transform:translate(-50%,10px);z-index:1200;background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}

  /* ───── 하단 시트 ───── */
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:1100;height:calc(100dvh - var(--top) - 6px);background:var(--bg);border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.22);overflow:hidden;display:flex;flex-direction:column;transform:translateY(60%);transition:transform .32s cubic-bezier(.2,.8,.2,1);will-change:transform}
  .sheet.dragging{transition:none}
  .sheet-head{flex:0 0 auto;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;padding-bottom:6px}
  .sheet.dragging .sheet-head{cursor:grabbing}
  .grab{display:flex;justify-content:center;padding:10px 0 6px}
  .grab span{width:40px;height:5px;border-radius:999px;background:var(--soft2)}

  .focus{display:none;margin:2px 16px 12px;padding:16px;border-radius:20px;background:var(--ink);color:#fff}
  .focus.show{display:block}
  .focus-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .focus-name{font-size:17px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

  .focus-state{font-size:12px;font-weight:700;color:var(--volt);margin-top:3px}
  .focus-btns{display:flex;gap:6px;flex:0 0 auto}
  .icon-c{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .focus-big{display:flex;align-items:baseline;gap:6px;margin:10px 0 2px}

  .focus-big span{font-family:var(--num);font-weight:700;font-size:20px;color:#9A9AA0}
  .focus-bar{height:4px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden;margin:10px 0 12px}
  .focus-bar i{display:block;height:100%;background:var(--volt);border-radius:999px;transition:width .5s}
  .focus-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px}
  .focus-grid div{display:flex;flex-direction:column;gap:2px;min-width:0}
  .focus-grid b{font-family:var(--num);font-weight:700;font-size:21px;line-height:1;white-space:nowrap}
  .focus-grid span{font-size:11px;color:#9A9AA0;font-weight:600;white-space:nowrap}
  .splits{display:none;gap:6px;overflow-x:auto;margin:12px -16px 0;padding:0 16px;scrollbar-width:none;touch-action:pan-x}
  .splits::-webkit-scrollbar{display:none}
  .split{flex:0 0 auto;background:rgba(255,255,255,.08);border-radius:10px;padding:6px 9px;display:flex;flex-direction:column;gap:1px}
  .split span{font-size:10px;font-weight:700;color:#9A9AA0}
  .split b{font-family:var(--num);font-weight:700;font-size:15px}
  .split.last{background:var(--volt);color:var(--ink)}
  .split.last span{color:#3a4200}
  .focus-actions{display:flex;gap:8px;margin-top:14px}
  .focus-actions button{flex:1;height:42px;border-radius:999px;font-size:14px;font-weight:800}
  .btn-volt{background:var(--volt);color:var(--ink)}
  .btn-ghost{background:rgba(255,255,255,.12);color:#fff}

  .notice{display:none;margin:0 16px 10px;padding:10px 12px;border-radius:12px;background:#FFF6D6;color:#5A4300;font-size:13px;font-weight:700;line-height:1.4}
  .notice.show{display:block}
  .mtag{font-size:10px;font-weight:800;background:#FFE7D6;color:#B23C00;padding:2px 6px;border-radius:999px;white-space:nowrap}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);margin:0 16px;border-bottom:1px solid var(--line)}
  .stat{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:4px 2px 10px;position:relative;text-align:left}
  .stat b{font-family:var(--num);font-weight:800;font-style:italic;font-size:32px;line-height:1;color:var(--ink3);transition:color .15s}
  .stat span{font-size:12px;font-weight:700;color:var(--ink3);white-space:nowrap}

  .stat.active::after{content:"";position:absolute;left:2px;right:16px;bottom:-1px;height:3px;border-radius:3px;background:var(--ink)}
  .stat[data-filter="running"] b{color:var(--run)}
  .stat[data-filter="running"]:not(.active) b{opacity:.55}

  .tools{display:flex;align-items:center;gap:8px;padding:12px 16px 4px}
  .search{flex:1;position:relative;min-width:0}
  .search input{width:100%;height:40px;border-radius:999px;border:0;background:var(--soft);padding:0 14px 0 38px;font-size:16px;font-family:var(--sans);color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
  .search input::placeholder{color:var(--ink3)}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink3)}
  .seg{display:none;background:var(--soft);border-radius:999px;padding:3px;flex:0 0 auto}
  .seg button{height:34px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:800;color:var(--ink2)}
  .seg button.on{background:var(--ink);color:#fff}
  .sync{font-size:11px;color:var(--ink2);font-weight:600;padding:6px 18px 0;display:flex;justify-content:space-between;gap:8px}
  .sync b{color:var(--ink);font-weight:700}
  .sync .bad{color:var(--warn)}

  .list{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 0 calc(var(--safe-b) + 24px)}
  .sheet:not(.full) .list{overflow:hidden;touch-action:none}
  .ghead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 16px 8px;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .ghead .gl{font-family:var(--num);font-weight:800;font-style:italic;font-size:22px;line-height:1;width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--volt);display:inline-flex;align-items:center;justify-content:center}
  .ghead .gl.star{background:var(--gold);color:#fff;font-style:normal;font-size:16px}
  .ghead .gt{display:flex;flex-direction:column;line-height:1.2;flex:1;min-width:0}
  .ghead .gt b{font-size:15px;font-weight:800;letter-spacing:-.02em}
  .ghead .gt span{font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ghead .gs{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--ink2);white-space:nowrap}
  .ghead .gs.live{background:rgba(0,184,74,.12);color:var(--run)}
  .ghead .gs.done{background:var(--ink);color:var(--volt)}

  .row{display:grid;grid-template-columns:30px 1fr auto;gap:2px 10px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
  .row:active{background:var(--soft)}
  .row.selected{background:var(--soft)}
  .row.selected::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--ink)}
  .rank{font-family:var(--num);font-weight:700;font-size:17px;color:var(--ink3);grid-row:1/4;align-self:start;padding-top:2px}
  .who{display:flex;align-items:center;gap:6px;min-width:0}
  .who b{font-size:16px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
  .who small{font-size:12px;color:var(--ink3);font-weight:600;white-space:nowrap}
  .gchip{font-family:var(--num);font-weight:800;font-size:12px;line-height:1;padding:3px 6px;border-radius:6px;background:var(--soft2);color:var(--ink);white-space:nowrap}
  .tag{font-size:10px;font-weight:800;background:var(--ink);color:var(--volt);padding:2px 6px;border-radius:999px;white-space:nowrap}
  .fav{display:none;width:28px;height:28px;margin:-6px -4px -6px auto;align-items:center;justify-content:center;color:var(--ink3);flex:0 0 auto}
  .fav.on{color:var(--gold)}
  .dist{grid-row:1/4;grid-column:3;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
  .dist b{font-family:var(--num);font-weight:800;font-style:italic;font-size:30px;line-height:.95}
  .dist span{font-size:11px;font-weight:700;color:var(--ink3)}
  .tick{grid-column:2;font-size:13px;font-weight:800;color:var(--run);letter-spacing:-.01em;display:flex;align-items:center;gap:5px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .tick small{font-size:11px;color:var(--ink3);font-weight:700}
  .tick.wait{color:var(--ink2)}
  .meta{grid-column:2;font-size:12px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .d{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .bar{grid-column:2/4;height:3px;background:var(--soft2);border-radius:999px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;border-radius:999px;transition:width .5s}
  .empty{padding:40px 16px;text-align:center;color:var(--ink3);font-size:14px;font-weight:600}
  .credit{padding:22px 16px 8px;text-align:center;font-size:11px;color:var(--ink3);font-weight:600;line-height:1.7}
  .credit b{color:var(--ink);letter-spacing:.12em}

  /* ───── 지도 마커 ───── */
  .mk{position:absolute;left:0;top:0;width:0;height:0}
  .mk-in{position:absolute;left:0;bottom:0;transform:translate(-50%,4px);display:flex;flex-direction:column;align-items:center;cursor:pointer}
  .mk-label{background:#fff;color:var(--ink);font-size:12px;font-weight:800;padding:4px 8px;border-radius:999px;white-space:nowrap;display:flex;align-items:center;gap:5px;box-shadow:0 3px 10px rgba(0,0,0,.35);letter-spacing:-.02em}
  .mk-label em{font-style:italic;font-family:var(--num);font-weight:800;font-size:13px;color:var(--ink2)}
  .mk-n{font-family:var(--num);font-style:normal;font-weight:800;font-size:11px;background:var(--ink);color:var(--volt);border-radius:999px;padding:1px 6px;margin-left:1px}
  .mk.sel .mk-n{background:var(--volt);color:var(--ink)}
  .mk-stem{width:2px;height:7px;background:#fff}
  .mk-dot{width:10px;height:10px;border-radius:50%;background:var(--run);border:2px solid #fff;box-shadow:0 0 0 3px rgba(0,0,0,.25)}
  .mk.fin .mk-dot{background:var(--volt)}
  .mk.wait .mk-dot{background:var(--wait)}
  .mk.sel .mk-label{background:var(--ink);color:#fff;font-size:13px;padding:6px 11px}
  .mk.sel .mk-label em{color:var(--volt)}
  .mk.sel .mk-stem{background:var(--ink)}
  .mk.sel .mk-dot{width:14px;height:14px;background:var(--volt);border-color:var(--ink);box-shadow:0 0 0 6px rgba(212,255,0,.35)}
  .km-tag{position:absolute;transform:translate(-50%,-50%);font-family:var(--num);font-weight:800;font-size:11px;color:#111;background:var(--volt);border:2px solid #111;border-radius:999px;padding:1px 5px;white-space:nowrap;line-height:1.2}
  .km-tag.turn{background:#fff}
  .sf-dot{position:absolute;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
  .sf-dot.start{background:var(--run)} .sf-dot.finish{background:#111}
  .sf{position:absolute;top:0;font-family:var(--num);font-weight:800;font-style:italic;font-size:12px;letter-spacing:.06em;padding:3px 8px;border-radius:6px;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.4)}
  .sf.start{background:var(--run);color:#fff;right:9px;transform:translateY(-50%)}
  .sf.finish{color:#111;background:#fff;background-image:linear-gradient(45deg,#111 25%,transparent 25%,transparent 75%,#111 75%),linear-gradient(45deg,#111 25%,transparent 25%,transparent 75%,#111 75%);background-size:8px 8px;background-position:0 0,4px 4px;left:9px;transform:translateY(-50%)}
  .sf.finish span{background:#fff;padding:0 4px;border-radius:3px}

  /* ───── 작은 화면(아이폰 SE 등) 압축 ───── */
  @media (max-height:740px), (max-width:350px){
    .focus{padding:13px 14px;margin-bottom:10px}
    .focus-big{margin:6px 0 0}
    .focus-big b{font-size:44px}
    .focus-bar{margin:8px 0 10px}
    .focus-grid b{font-size:18px}
    .focus-actions{margin-top:10px}
    .focus-actions button{height:38px}
    .splits{margin-top:10px}
    .stat b{font-size:26px}
    .stat{padding-bottom:8px}
    .brand-logo .logo{width:48px}
  }

  /* ───── 보완판 전용 ───── */
  body.plus .brand-badge{display:none}
  body.plus .brand-logo{display:block}
  body.plus .race-clock{display:inline}
  body.plus .seg{display:flex}
  body.plus .fav{display:inline-flex}
  body.plus .splits{display:flex}

  /* ───── 데스크톱: 왼쪽 패널 ───── */
  @media (min-width:900px){
    .sheet{left:16px;right:auto;top:84px;bottom:16px;width:400px;height:auto;border-radius:24px;transform:none!important;transition:none}
    .sheet .list{overflow-y:auto!important;touch-action:auto!important}
    .grab{display:none}
    .sheet-head{cursor:default;touch-action:auto;padding-top:12px}
    .follow-pill{left:calc(50% + 208px)}
    .toast{left:calc(50% + 208px);bottom:28px}
  }
</style>
</head>

        <div><b id="fPace">-</b><span>평균 페이스</span></div>
        <div><b id="fNet">-</b><span id="fNetLabel">달린 시간</span></div>
        <div><b id="fNextEta">-</b><span id="fNextLabel">다음 구간 도착</span></div>
        <div><b id="fNextIn">-</b><span>남은 시간</span></div>
        <div><b id="fEta">-</b><span id="fEtaLabel">예상 완주</span></div>
      </div>
      <div class="splits" id="fSplits"></div>
      <div class="focus-actions">
        <button class="btn-volt" id="fFollow">추적 해제</button>
      </div>
    </div>

    <div class="notice" id="notice"></div>
    <div class="stats" id="stats">
      <button class="stat active" data-filter="all"><b id="cAll">0</b><span>전체</span></button>
      <button class="stat" data-filter="running"><b id="cRun">0</b><span>달리는 중</span></button>
      <button class="stat" data-filter="finished"><b id="cFin">0</b><span>완주</span></button>
      <button class="stat" data-filter="standby"><b id="cWait">0</b><span>출발 전</span></button>
    </div>
    <div class="tools">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <input type="search" id="search" placeholder="이름 또는 배번 검색" autocomplete="off" enterkeyhint="search" />
      </label>
      <div class="seg" id="viewSeg">
        <button class="on" data-view="group">조별</button>
        <button data-view="rank">순위</button>
      </div>
    </div>
    <div class="sync"><span>기록 기준 <b id="syncFoot">--:--:--</b></span><span id="syncDesc">-</span></div>
  </div>

  <div class="list" id="list"></div>
</section>

<div class="toast" id="toast"></div>
<div class="celeb" id="celeb" role="status" aria-live="polite"></div>

<!-- 응원 채팅 -->
<button class="chat-fab" id="chatFab" aria-label="응원 채팅 열기">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.9-.9L3 20.5l1.5-4.6A8.4 8.4 0 1 1 21 11.5z"/></svg>
  <span class="badge" id="chatBadge">0</span>
</button>
<section class="chat" id="chat" aria-label="응원 채팅">
  <div class="chat-head">
    <div class="ct"><b>💬 크루 응원 채팅</b><span><i id="chatDot"></i><span id="chatState">연결 중…</span></span></div>
    <button class="chat-nick" id="chatNick" title="닉네임 바꾸기">닉네임</button>
    <button class="chat-x" id="chatClose" aria-label="채팅 닫기"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
  </div>
  <div class="chat-gate" id="chatGate">
    <h3>닉네임을 정해주세요</h3>
    <p>채팅에 보일 이름이에요.<br>크루원들이 알아볼 수 있게 적어주세요.</p>
    <input id="nickInput" maxlength="12" placeholder="예: 만두, 배찌" autocomplete="off" enterkeyhint="done" />
    <button id="nickSave">입장하기</button>
  </div>
  <div class="chat-msgs" id="chatMsgs" hidden></div>
  <div id="chatBottom" hidden>
    <div class="chat-quick" id="chatQuick"></div>
    <div class="chat-input">
      <input id="chatText" maxlength="200" placeholder="응원 메시지 보내기" autocomplete="off" enterkeyhint="send" />
      <button id="chatSend">보내기</button>
    </div>
    <div class="chat-note" style="padding-bottom:calc(env(safe-area-inset-bottom,0px) + 4px)">메시지는 12시간 뒤 자동으로 사라져요</div>
  </div>
</section>

const DEMO_T0 = Date.now();
/* 데모에서는 A조가 '80분 전'에 출발한 것으로 시간을 옮김 */
/* 데모: 08:58(A조 출발 2분 전)부터 시작해 기본 20배속으로 진행 → 약 20분이면 전원 완주까지 볼 수 있음.
   속도 변경: 주소 끝에 ?demo&speed=60 (60배속), ?demo&speed=1 (실제 속도) */
const DEMO_SPEED = Math.max(1, Math.min(120, Number(QS.get('speed')) || 20));
function nowMs(){ return DEMO ? Date.parse(`${RACE_DATE}T08:58:00+09:00`) + (Date.now() - DEMO_T0) * DEMO_SPEED : Date.now(); }
function groupStartMs(g){ const t = GROUP_START[g] || GROUP_START.A; return Date.parse(`${RACE_DATE}T${t}:00+09:00`); }
const FIRST_START_MS = groupStartMs('A');
const LAST_START_MS = Math.max(...GROUPS.map(groupStartMs));
function kstClockSec(ms){ const d = new Date(ms); return ((d.getUTCHours()+9)%24)*3600 + d.getUTCMinutes()*60 + d.getUTCSeconds(); }
function hms(s){
  if(!s) return null;
  const p = String(s).trim().split(':').map(Number);
  if(p.some(n => isNaN(n))) return null;
  const v = p.length === 3 ? p[0]*3600+p[1]*60+p[2] : p.length === 2 ? p[0]*60+p[1] : null;
  return v > 0 ? v : null;
}
function fmtHMS(sec){ sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60; return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
function fmtPace(sec){ sec = Math.round(sec); return `${Math.floor(sec/60)}'${String(sec%60).padStart(2,'0')}"`; }
function fmtElapsed(sec){
  sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return h ? `${h}시간 ${m}분 ${String(s).padStart(2,'0')}초째` : `${m}분 ${String(s).padStart(2,'0')}초째`;
}
function fmtUntil(ms){
  const m = Math.ceil(ms/60000); if(m <= 0) return '곧 출발';
  const h = Math.floor(m/60);
  return h ? `출발까지 ${h}시간 ${m%60}분` : `출발까지 ${m}분`;
}
function cpName(km){
  if(km >= FULL) return '도착';
  if(km < 0.01) return '출발';
  if(Math.abs(km-TURN_KM) < 0.01) return '반환점';
  if(Math.abs(km-21.0975) < 0.01) return '하프';
  return `${+km.toFixed(1)}K`;
}

/* ───────── 선수 상태 ───────── */
function groupStarted(g){ return nowMs() >= groupStartMs(g); }
/* 조 출발 시각은 '예상'이라, 예상보다 일찍 출발한 크루원이 한 명이라도 있으면 그 조는 레이스 중으로 봄 */
function groupLive(g){ return groupStarted(g) || runners.some(r => r.group === g && (r.started || (Number(r.km) || 0) > 0)); }
function status(r){
  const km = Number(r.km) || 0;
  if(km >= 42.19) return 'finished';
  if(km > 0 || r.started || groupStarted(r.group)) return 'running';
  return 'standby';
}
function nextCp(km){ return CHECKPOINTS.find(c => km < c - 1e-6) ?? FULL; }
function paceOf(r){
  const net = hms(r.net_time), km = Number(r.km) || 0;
  if(!net || km < 3) return null;
  const p = net / km;
  return (p >= 150 && p <= 720) ? p : null;
}
/* 달린 시간: 본인 출발 매트 시각이 있으면 그 기준, 없으면 소속 조 출발 시각 기준 */
function elapsedOf(r){
  if(!groupStarted(r.group) && !r.started) return null;
  const nowC = kstClockSec(nowMs());
  const st = hms(r.start_time);
  if(st && st > 6*3600 && st < 20*3600 && nowC >= st && nowC - st < 9*3600) return { sec: nowC - st, own: true };
  const sec = (nowMs() - groupStartMs(r.group)) / 1000;
  if(sec < 0 || sec > 9*3600) return null;
  return { sec, own: false };
}
/* 현재 페이스: 가장 최근 약 3km 이상 구간의 페이스 (구간기록 기반). 없으면 평균 페이스 */
function splitsOf(r){
  return (Array.isArray(r.splits) ? r.splits : [])
    .map(s => ({ km: Number(s && s.km), net: hms(s && s.net) }))
    .filter(s => s.km > 0 && s.net).sort((a, b) => a.km - b.km);
}
function curPaceOf(r){
  const sp = splitsOf(r);
  if(!sp.length) return paceOf(r);
  const last = sp[sp.length - 1];
  let prev = { km: 0, net: 0 };
  for(let i = sp.length - 2; i >= 0; i--){ if(last.km - sp[i].km >= 2.9){ prev = sp[i]; break; } }
  const d = last.km - prev.km, t = last.net - prev.net;
  if(d <= 0 || t <= 0) return paceOf(r);
  const p = t / d;
  return (p >= 150 && p <= 720) ? p : paceOf(r);
}
/* 다음 계측구간: 이름, 도착 예상 시각(시:분), 남은 분 */
function nextInfo(r){
  if(status(r) !== 'running') return null;
  const km = Number(r.km) || 0, nc = nextCp(km);
  const p = curPaceOf(r), pass = hms(r.pass_time);
  if(!p || !pass || pass < 6*3600 || pass > 20*3600) return { name: cpName(nc), eta: null, mins: null };
  const eta = pass + (nc - km) * p;
  const mins = Math.round((eta - kstClockSec(nowMs())) / 60);
  const hh = Math.floor(eta / 3600) % 24, mm = Math.floor(eta % 3600 / 60);
  return { name: cpName(nc), eta: `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`, mins };
}
function minsText(m){ return m == null ? '' : m <= 0 ? '곧 도착' : m < 60 ? `${m}분 후` : `${Math.floor(m/60)}시간 ${m%60}분 후`; }
/* 예상 완주: 지금까지 기록 + 남은 거리 × 현재 페이스 */
function finishEta(r){
  const net = hms(r.net_time), km = Number(r.km) || 0, p = curPaceOf(r);
  if(!net || !p || km < 3) return null;
  return net + (FULL - km) * p;
}
/* 지금쯤 위치 추정: 마지막 통과 시각 + 현재 페이스 (다음 체크포인트는 넘지 않음) */
function estKm(r){
  if(status(r) !== 'running') return null;
  const p = curPaceOf(r), pass = hms(r.pass_time), km = Number(r.km) || 0;
  if(!p || !pass || pass < 6*3600 || pass > 20*3600) return null;
  const el = kstClockSec(nowMs()) - pass;
  if(el < 0 || el > 2*3600) return null;
  return Math.min(km + el/p, nextCp(km) - 0.05);
}

/* 지도 배경: OpenStreetMap (무료·키 불필요·한글 지명). 막히면 Esri 일반 지도로 자동 교체.
   🌙 버튼으로 같은 지도를 어둡게 볼 수 있음 */
const TILE_SOURCES = [
  { name:'osm',  url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', opt:{ maxNativeZoom:19, maxZoom:18 } },
  { name:'esri', url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', opt:{ maxNativeZoom:18, maxZoom:18 } },
];
let tileIdx = -1, tileLayer = null, tileOk = 0, tileErr = 0, tileTimer = null;
function useTiles(i){
  if(i >= TILE_SOURCES.length) return;               // 모두 실패해도 코스선·마커는 그대로 보임
  if(tileLayer) map.removeLayer(tileLayer);
  tileIdx = i; tileOk = 0; tileErr = 0;
  const src = TILE_SOURCES[i];
  tileLayer = L.tileLayer(src.url, { ...src.opt, crossOrigin:false }).addTo(map);
  tileLayer.on('tileload', () => { tileOk++; });
  tileLayer.on('tileerror', () => { tileErr++; if(tileOk === 0 && tileErr >= 4) useTiles(i + 1); });
  clearTimeout(tileTimer);
  tileTimer = setTimeout(() => { if(tileIdx === i && tileOk === 0) useTiles(i + 1); }, 7000);
}
useTiles(0);

/* 코스: GPX 점들의 누적 거리 계산 → km 로 위치 찾기 */
function hav(a, b){
  const R = 6371008.8, r = Math.PI/180;
  const dLa = (b[0]-a[0])*r, dLo = (b[1]-a[1])*r;
  const x = Math.sin(dLa/2)**2 + Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
const CUM = [0];
for(let i = 1; i < COURSE.length; i++) CUM.push(CUM[i-1] + hav(COURSE[i-1], COURSE[i]));
const SCALE = FULL / (CUM[CUM.length-1] / 1000 || FULL);    // GPX 길이를 정확히 42.195km 로 맞춤
const CUM_KM = CUM.map(m => m/1000*SCALE);
function latLngAt(km){
  const k = Math.max(0, Math.min(FULL, Number(km) || 0));
  let lo = 0, hi = CUM_KM.length - 1;
  while(hi - lo > 1){ const mid = (lo+hi) >> 1; if(CUM_KM[mid] <= k) lo = mid; else hi = mid; }
  const a = COURSE[lo], b = COURSE[hi], seg = (CUM_KM[hi] - CUM_KM[lo]) || 1;
  const t = Math.max(0, Math.min(1, (k - CUM_KM[lo]) / seg));
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t];
}
L.polyline(COURSE, { color:'#111111', weight:9, opacity:.8, lineJoin:'round', lineCap:'round', interactive:false }).addTo(map);
const courseLine = L.polyline(COURSE, { color:'#D4FF00', weight:4, opacity:.95, lineJoin:'round', lineCap:'round', interactive:false }).addTo(map);

function uiInsets(){
  if(isDesktop()) return { left: 432, top: 70, bottom: 0 };
  const topH = sheet.getBoundingClientRect().top;
  return { left: 0, top: 70, bottom: Math.max(0, window.innerHeight - topH) };
}
function focusOn(latlng, zoom, animate = true){
  const z = zoom ?? map.getZoom();
  const ins = uiInsets();
  const pt = map.project(latlng, z).add([-ins.left/2, (ins.bottom - ins.top)/2]);
  const c = map.unproject(pt, z);
  if(document.hidden) animate = false;
  if(animate && z !== map.getZoom()) map.flyTo(c, z, { duration:.6 });
  else if(!animate) map.setView(c, z, { animate:false });
  else map.panTo(c, { animate, duration:.5 });
}
/* 전체 코스 보기: 화면 크기를 아직 모를 때(창이 숨겨진 채 열림 등)는 기본 위치로 → 최대 확대로 튀는 문제 방지 */
function fitCourse(animate = true){
  map.invalidateSize(false);
  const sz = map.getSize(), ins = uiInsets();
  const availW = sz.x - ins.left - 48, availH = sz.y - ins.top - ins.bottom - 34;
  if(sz.x < 80 || sz.y < 80 || availW < 120 || availH < 120){ map.setView(...DEFAULT_VIEW); return; }
  const opt = { paddingTopLeft:[ins.left + 24, ins.top + 10], paddingBottomRight:[24, ins.bottom + 24], maxZoom:15 };
  if(animate && !document.hidden) map.flyToBounds(courseLine.getBounds(), { ...opt, duration:.6 });
  else map.fitBounds(courseLine.getBounds(), { ...opt, animate:false });   // 백그라운드에서 열려도 확대가 멈추지 않도록 즉시 적용
}
/* 사용자가 지도를 직접 만지기 전까지는, 화면 크기가 바뀌면 코스 전체가 보이도록 다시 맞춤 */
let userMoved = false;
map.on('dragstart', () => { userMoved = true; });
map.getContainer().addEventListener('wheel', () => { userMoved = true; }, { passive:true });
map.getContainer().addEventListener('touchstart', e => { if(e.touches.length > 1) userMoved = true; }, { passive:true });
function refitIfIdle(){ if(!userMoved && !selectedBib) fitCourse(false); }

/* ───────── 상태 ───────── */
let runners = ROSTER.map(r => ({ ...r }));
let lastPayload = null;
let selectedBib = null;
let following = false;
let filter = 'all';
let query = '';
let view = UI_PLUS ? store.get('gsrc_view', 'group') : 'group';
let favs = new Set(UI_PLUS ? store.get('gsrc_favs', []) : []);
let fetching = false;

/* 마커 */
const markerLayer = L.layerGroup().addTo(map);
const groupCycle = {};
function markerHtml(cls, label, count){
  return `<div class="mk ${cls}"><div class="mk-in"><div class="mk-label">${label}${count > 1 ? `<span class="mk-n">${count}</span>` : ''}</div><div class="mk-stem"></div><div class="mk-dot"></div></div></div>`;
}
/* 화면에서 가까이 붙은 선수들은 하나의 표시로 묶음 (확대하면 자동으로 풀림) */
function drawMarkers(){
  markerLayer.clearLayers();
  const items = [];
  runners.forEach(r => {
    if(String(r.bib) === selectedBib) return;
    const st = status(r);
    const e = st === 'running' ? estKm(r) : null;
    const km = st === 'standby' ? 0 : (e ?? (Number(r.km) || 0));
    const ll = latLngAt(km);
    items.push({ r, st, km, est: e != null, ll, pt: map.latLngToLayerPoint(ll) });
  });
  items.sort((a, b) => b.km - a.km || a.r.order - b.r.order);
  const clusters = [];
  items.forEach(it => {
    const isWait = it.st === 'standby';
    const c = clusters.find(c => c.wait === isWait && (isWait || (Math.abs(c.pt.x - it.pt.x) < 120 && Math.abs(c.pt.y - it.pt.y) < 34)));
    if(c) c.items.push(it); else clusters.push({ wait: isWait, pt: it.pt, ll: it.ll, items: [it] });
  });
  clusters.forEach((c, ci) => {
    const lead = c.items[0], n = c.items.length, names = c.items.map(i => i.r.name);
    let label, cls;
    if(c.wait){ label = `출발 전 <em>${n}명</em>`; cls = 'wait'; }
    else {
      const who = n === 1 ? names[0] : n === 2 ? names.join('·') : `${names[0]} 외 ${n-1}`;
      label = `${esc(who)} <em>${lead.km < 0.01 ? '출발' : (lead.est ? '~' : '') + lead.km.toFixed(1) + 'K'}</em>`;
      cls = c.items.every(i => i.st === 'finished') ? 'fin' : 'run';
    }
    const m = L.marker(c.ll, { icon: tagIcon(markerHtml(cls, label, c.wait ? 0 : n)), zIndexOffset: c.wait ? -100 : 100 - ci });
    m.on('click', () => {
      if(c.wait){ setFilter('standby'); setSnap('half'); return; }
      if(n === 1){ selectRunner(lead.r.bib); return; }
      const spread = c.items.some(i => Math.abs(i.km - lead.km) > 0.02);
      if(spread && map.getZoom() < 17){
        if(following) stopFollow('확대해서 크루원을 나눠 보여드려요');
        map.flyToBounds(L.latLngBounds(c.items.map(i => i.ll)), { padding:[80, 80], maxZoom:17, duration:.5 });
        return;
      }
      const key = names.join('|');
      const i = (groupCycle[key] = ((groupCycle[key] ?? -1) + 1) % n);
      selectRunner(c.items[i].r.bib);
    });
    markerLayer.addLayer(m);
  });
  const sel = runners.find(r => String(r.bib) === selectedBib);
  if(sel){
    const st = status(sel);
    const e = st === 'running' ? estKm(sel) : null;
    const km = st === 'standby' ? 0 : (e ?? (Number(sel.km) || 0));
    const label = `${esc(sel.name)} <em>${km < 0.01 ? (st === 'standby' ? '출발 전' : '출발') : (e != null ? '~' : '') + km.toFixed(1) + 'K'}</em>`;
    markerLayer.addLayer(L.marker(latLngAt(km), { icon: tagIcon(markerHtml('sel', label, 0)), zIndexOffset: 1000, interactive:false }));
  }
}
map.on('zoomend', () => drawMarkers());
function selectedLatLng(){
  const r = runners.find(x => String(x.bib) === selectedBib);
  if(!r) return null;
  const st = status(r);
  return latLngAt(st === 'standby' ? 0 : ((st === 'running' ? estKm(r) : null) ?? (Number(r.km) || 0)));
}

/* ═════════════ 하단 시트 (끌어서 올리고 내리기) ═════════════ */
const sheet = $('sheet'), head = $('sheetHead'), list = $('list');
let snap = 'half', curY = 0;
function sheetH(){ return sheet.getBoundingClientRect().height; }
function snapY(name){
  const H = sheetH();
  const peek = Math.min(H - 60, head.offsetHeight + 4);
  if(name === 'full') return 0;
  if(name === 'peek') return Math.max(0, H - peek);
  return Math.max(0, Math.min(H - peek, H - Math.round(window.innerHeight * .52)));
}
function applyY(y){
  curY = y;
  sheet.style.transform = `translateY(${y}px)`;
  document.documentElement.style.setProperty('--sheet-vis', `${Math.max(0, sheetH() - y)}px`);
}
function setSnap(name){
  if(isDesktop()){ sheet.style.transform = ''; sheet.classList.add('full'); return; }
  snap = name;
  sheet.classList.toggle('full', name === 'full');
  if(name !== 'full') list.scrollTop = 0;
  applyY(snapY(name));
}
let drag = null, suppressClick = false;
function onDown(e){
  if(isDesktop()) return;
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  if(e.target.closest('input, .splits')) return;
  const inList = !!e.target.closest('#list');
  if(inList && snap === 'full') return;
  drag = { id:e.pointerId, y0:e.clientY, t0:curY, moved:false, lastY:e.clientY, lastT:performance.now(), v:0 };
}
function onMove(e){
  if(!drag || e.pointerId !== drag.id) return;
  const dy = e.clientY - drag.y0;
  if(!drag.moved){
    if(Math.abs(dy) < 6) return;
    drag.moved = true;
    sheet.classList.add('dragging');
    try{ sheet.setPointerCapture(e.pointerId); }catch(_){}
  }
  const now = performance.now();
  drag.v = (e.clientY - drag.lastY) / Math.max(1, now - drag.lastT);
  drag.lastY = e.clientY; drag.lastT = now;
  const maxY = snapY('peek');
  let y = drag.t0 + dy;
  if(y < 0) y = y * .25;
  if(y > maxY) y = maxY + (y - maxY) * .25;
  applyY(y);
}
function onUp(e){
  if(!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  sheet.classList.remove('dragging');
  if(!d.moved) return;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 60);
  const order = ['full','half','peek'];
  const nearest = order.reduce((a,b) => Math.abs(snapY(b)-curY) < Math.abs(snapY(a)-curY) ? b : a);
  let target = nearest;
  if(Math.abs(d.v) > .45){
    if(d.v > 0) target = order.find(n => snapY(n) > curY + 1) || 'peek';
    else target = [...order].reverse().find(n => snapY(n) < curY - 1) || 'full';
  }
  setSnap(target);
}
sheet.addEventListener('pointerdown', onDown);
window.addEventListener('pointermove', onMove);
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
sheet.addEventListener('click', e => { if(suppressClick){ e.stopPropagation(); e.preventDefault(); suppressClick = false; } }, true);
$('grab').addEventListener('click', () => setSnap(snap === 'peek' ? 'half' : snap === 'half' ? 'full' : 'half'));
list.addEventListener('wheel', e => {
  if(isDesktop()) return;
  if(snap !== 'full' && e.deltaY > 0){ e.preventDefault(); setSnap('full'); }
  else if(snap === 'full' && list.scrollTop <= 0 && e.deltaY < -20){ setSnap('half'); }
}, { passive:false });
let resizeT;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { setSnap(snap); refitIfIdle(); }, 120); });

/* ═════════════ 선택 · 추적 ═════════════ */
function selectRunner(bib){
  if(!runners.some(r => String(r.bib) === String(bib))) return;
  selectedBib = String(bib);
  following = true;
  render();
  if(!isDesktop() && snap === 'full') setSnap('half'); else setSnap(snap);
  const ll = selectedLatLng();
  if(ll) setTimeout(() => focusOn(ll, Math.max(map.getZoom(), 14)), 30);
}
function stopFollow(msg = '추적을 해제했어요'){
  if(!following) return;
  following = false; render(); toast(msg);
}
function clearSelection(){ selectedBib = null; following = false; render(); setSnap(snap); }
function resumeFollow(){
  following = true; render();
  const ll = selectedLatLng(); if(ll) focusOn(ll, Math.max(map.getZoom(), 14));
  toast('다시 따라갑니다');
}
map.on('dragstart', () => { if(following) stopFollow('지도를 움직여 추적이 해제됐어요'); });
$('fFollow').addEventListener('click', () => following ? stopFollow() : resumeFollow());
$('fClose').addEventListener('click', clearSelection);
$('followPillOff').addEventListener('click', () => stopFollow());
$('fitBtn').addEventListener('click', () => { if(following) stopFollow('전체 코스 보기로 전환했어요'); fitCourse(); });
if(UI_PLUS){
  $('fShare').style.display = '';
  $('fShare').addEventListener('click', async () => {
    const r = runners.find(x => String(x.bib) === selectedBib); if(!r) return;
    const url = `${location.origin}${location.pathname}?bib=${encodeURIComponent(r.bib)}`;
    try{
      if(navigator.share){ await navigator.share({ title:`${r.name} 실시간 위치 · GSRC`, url }); return; }
    }catch(err){ if(err && err.name === 'AbortError') return; }
    try{ await navigator.clipboard.writeText(url); toast('링크를 복사했어요'); }
    catch(_){ prompt('이 링크를 복사하세요', url); }
  });
}

/* ═════════════ 완주 축하 배너 ═════════════
   - 새로 완주한 크루원이 생기면 상단에 축하 배너 + 꽃가루
   - 페이지를 늦게 연 경우엔 최근 15분 안에 완주한 사람만 축하 (몰아서 뜨지 않게)
   - 한 사람당 이 기기에서 한 번만 */
const celebrated = new Set(DEMO ? [] : store.get('gsrc_celebrated', []));
let celebReady = false, celebQueue = [], celebBusy = false, celebTimer = null;
function finishSecOf(r){
  const n = hms(r.net_time); if(n) return n;
  const st = hms(r.start_time), ps = hms(r.pass_time);
  return (st && ps && ps > st) ? ps - st : null;
}
function fmtKoDur(sec){
  sec = Math.round(sec); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return `${h ? h + '시간 ' : ''}${m}분 ${s}초`;
}
function checkFinishers(){
  if(!lastPayload && !manualData) return;            // 기록을 한 번도 못 받았으면 판단 보류
  const nowC = kstClockSec(nowMs());
  let changed = false;
  runners.forEach(r => {
    if(status(r) !== 'finished') return;
    const bib = String(r.bib);
    if(celebrated.has(bib)) return;
    celebrated.add(bib); changed = true;
    if(!celebReady){
      const ps = hms(r.pass_time);
      if(!ps || nowC - ps > 15*60 || nowC - ps < -120) return;   // 오래전 완주는 조용히 넘어감
    }
    celebQueue.push(bib);
  });
  celebReady = true;
  if(changed && !DEMO) store.set('gsrc_celebrated', [...celebrated]);
  showNextCeleb();
}
function showNextCeleb(){
  if(celebBusy || !celebQueue.length) return;
  const nextBib = celebQueue.shift();
  const r = runners.find(x => String(x.bib) === nextBib);
  if(!r){ showNextCeleb(); return; }
  celebBusy = true;
  const sec = finishSecOf(r), el = $('celeb');
  el.dataset.bib = r.bib;
  el.innerHTML = `<span class="cb-e">🎉</span><span class="cb-t"><b>${esc(r.name)}</b>님이 ${sec ? `<b>${fmtKoDur(sec)}</b>로 ` : ''}완주했습니다! 🏅<small>${esc(r.group)}조 · #${esc(r.bib)} · 눌러서 기록 보기</small></span><span class="cb-x" aria-hidden="true">✕</span>`;
  requestAnimationFrame(() => el.classList.add('show'));
  confetti();
  clearTimeout(celebTimer);
  celebTimer = setTimeout(hideCeleb, celebQueue.length > 2 ? 4500 : 6500);
}
function hideCeleb(){
  const el = $('celeb'); el.classList.remove('show');
  clearTimeout(celebTimer);
  setTimeout(() => { celebBusy = false; showNextCeleb(); }, 450);
}
$('celeb').addEventListener('click', e => {
  const bib = $('celeb').dataset.bib;
  if(!e.target.closest('.cb-x') && bib) selectRunner(bib);
  hideCeleb();
});
function confetti(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const E = ['🎉','🎊','✨','🏅','🥳','💛'];
  for(let i = 0; i < 18; i++){
    const c = document.createElement('span');
    c.className = 'confetti';
    c.textContent = E[i % E.length];
    c.style.left = `${Math.random()*100}vw`;
    c.style.setProperty('--dx', `${(Math.random()-.5)*120}px`);
    c.style.setProperty('--rot', `${(Math.random()-.5)*720}deg`);
    c.style.animationDelay = `${Math.random()*.5}s`;
    c.style.fontSize = `${16 + Math.random()*14}px`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3200);
  }
}

let toastT;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1900);
}

/* ═════════════ 화면 그리기 ═════════════ */
function setFilter(f){
  filter = f;
  document.querySelectorAll('#stats .stat').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
  renderList();
}
$('stats').addEventListener('click', e => { const b = e.target.closest('.stat'); if(b) setFilter(b.dataset.filter); });
$('search').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); renderList(); });
$('viewSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  view = b.dataset.view; store.set('gsrc_view', view); renderList();
});
list.addEventListener('click', e => {
  const fav = e.target.closest('.fav');
  if(fav){
    e.stopPropagation();
    const bib = fav.dataset.bib;
    if(favs.has(bib)){ favs.delete(bib); toast('관심 크루에서 뺐어요'); }
    else { favs.add(bib); toast('관심 크루로 위에 고정했어요'); }
    store.set('gsrc_favs', [...favs]); renderList(); return;
  }
  const row = e.target.closest('.row'); if(row) selectRunner(row.dataset.bib);
});

function byProgress(a, b){
  const sa = status(a), sb = status(b);
  if(sa === 'finished' && sb === 'finished') return (hms(a.net_time) || 9e9) - (hms(b.net_time) || 9e9);
  const d = (Number(b.km) || 0) - (Number(a.km) || 0);
  if(d) return d;
  if(sa === 'running' && sb === 'running'){
    const ea = hms(a.net_time), eb = hms(b.net_time);
    if(ea && eb && ea !== eb) return ea - eb;
  }
  return a.order - b.order;
}
function rankMap(){
  const all = [...runners].sort(byProgress);
  const m = new Map(); all.forEach((r, i) => m.set(String(r.bib), i + 1)); return m;
}
function tickText(r){
  if(status(r) === 'finished') return `🏁 완주${r.net_time ? ' ' + esc(r.net_time) : ''}`;
  if(status(r) === 'standby'){
    return `⏱ ${r.group}조 ${GROUP_START[r.group] || ''} 출발 예정 · ${fmtUntil(groupStartMs(r.group) - nowMs())}`;
  }
  const el = elapsedOf(r);
  if(!el) return '⏱ 출발 대기';
  return `⏱ ${fmtElapsed(el.sec)} 달리는 중${el.own ? '' : ' <small>예상 출발 기준</small>'}`;
}
function rowMeta(r){
  const st = status(r), km = Number(r.km) || 0;
  if(st === 'finished') return { dot:'var(--volt)', bar:'var(--ink)', text:`완주${r.net_time ? ' · ' + esc(r.net_time) : ''}` };
  if(st === 'standby')  return { dot:'var(--wait)', bar:'var(--wait)', text:'출발 전' };
  if(!r.started && km === 0) return { dot:'var(--run)', bar:'var(--run)', text:'레이스 중 · 출발 매트 기록 확인 중' };
  const cp = curPaceOf(r), ni = nextInfo(r);
  let t = `${cpName(km)} 통과`;
  if(r.pass_time) t += ` ${esc(String(r.pass_time).slice(0,5))}`;
  if(cp) t += ` · 현재 ${fmtPace(cp)}`;
  if(ni && ni.eta) t += ` · ${esc(ni.name)} ${ni.mins != null && ni.mins <= 0 ? '곧 도착' : '~' + ni.eta}`;
  return { dot:'var(--run)', bar:'var(--run)', text:t };
}
function rowHtml(r, leftLabel){
  const km = Number(r.km) || 0, m = rowMeta(r), sel = String(r.bib) === selectedBib, st = status(r);
  const star = UI_PLUS ? `<button class="fav${favs.has(String(r.bib)) ? ' on' : ''}" data-bib="${esc(r.bib)}" aria-label="관심 크루"><svg width="17" height="17" viewBox="0 0 24 24" fill="${favs.has(String(r.bib)) ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><polygon points="12 2.5 15 9 22 9.7 16.7 14.3 18.3 21.3 12 17.6 5.7 21.3 7.3 14.3 2 9.7 9 9"/></svg></button>` : '';
  return `<div class="row${sel ? ' selected' : ''}" data-bib="${esc(r.bib)}">
    <span class="rank">${leftLabel}</span>
    <div class="who"><b>${esc(r.name)}</b><small>#${esc(r.bib)}</small><span class="gchip">${esc(r.group)}조</span>${r.manual ? '<span class="mtag">수동</span>' : ''}${sel && following ? '<span class="tag">추적 중</span>' : ''}${star}</div>
    <div class="dist"><b>${km >= 42.19 ? '42.2' : km.toFixed(1)}</b><span>KM</span></div>
    <div class="tick${st === 'standby' ? ' wait' : ''}" data-tick="${esc(r.bib)}">${tickText(r)}</div>
    <div class="meta"><span class="d" style="background:${m.dot}"></span>${m.text}</div>
    <div class="bar"><i style="width:${Math.min(100, km/FULL*100)}%;background:${m.bar}"></i></div>
  </div>`;
}
function groupHead(g, members){
  const total = runners.filter(r => r.group === g).length;
  const fin = members.filter(r => status(r) === 'finished').length;
  const started = groupLive(g);
  let badge;
  if(!started) badge = `<span class="gs">${fmtUntil(groupStartMs(g) - nowMs())}</span>`;
  else if(fin === total && total) badge = `<span class="gs done">전원 완주</span>`;
  else badge = `<span class="gs live">레이스 중${fin ? ` · 완주 ${fin}` : ''}</span>`;
  return `<div class="ghead" data-group="${g}"><span class="gl">${g}</span><span class="gt"><b>${g}조</b><span>${GROUP_START[g]} 출발 예정 · ${total}명</span></span>${badge}</div>`;
}
function renderList(){
  document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  const ranks = rankMap();
  const match = r => {
    if(filter !== 'all' && status(r) !== filter) return false;
    if(query) return r.name.toLowerCase().includes(query) || String(r.bib).includes(query) || `${r.group}조`.toLowerCase().includes(query);
    return true;
  };
  const rows = runners.filter(match);
  if(!rows.length){ list.innerHTML = `<div class="empty">해당하는 크루원이 없어요</div>` + credit(); return; }
  let html = '';
  if(UI_PLUS && favs.size){
    const fl = rows.filter(r => favs.has(String(r.bib))).sort(byProgress);
    if(fl.length){
      html += `<div class="ghead"><span class="gl star">★</span><span class="gt"><b>관심 크루</b><span>별표를 누른 크루원</span></span></div>`;
      html += fl.map(r => rowHtml(r, String(ranks.get(String(r.bib))).padStart(2,'0'))).join('');
    }
  }
  if(view === 'rank' && UI_PLUS){
    html += `<div class="ghead"><span class="gl">#</span><span class="gt"><b>전체 순위</b><span>달린 거리 · 기록 순</span></span></div>`;
    html += [...rows].sort(byProgress).map(r => rowHtml(r, String(ranks.get(String(r.bib))).padStart(2,'0'))).join('');
  } else {
    GROUPS.forEach(g => {
      const members = rows.filter(r => r.group === g);
      if(!members.length) return;
      html += groupHead(g, members);
      html += [...members].sort((a, b) => (groupLive(g) ? byProgress(a, b) : a.order - b.order))
        .map(r => rowHtml(r, String(ranks.get(String(r.bib))).padStart(2,'0'))).join('');
    });
    const others = rows.filter(r => !GROUPS.includes(r.group));
    if(others.length) html += others.map(r => rowHtml(r, '--')).join('');
  }
  list.innerHTML = html + credit();
}
function credit(){
  return `<div class="credit">지도 © OpenStreetMap contributors · Esri<br>made by <b>bazzi</b> · GSRC</div>`;
}

function renderSync(){
  const p = lastPayload, dot = $('liveDot'), now = nowMs();
  dot.className = 'live-dot';
  if(DEMO){
    dot.classList.add('demo');
    $('syncTop').textContent = `데모 ${DEMO_SPEED}배속`;
    $('syncFoot').textContent = fmtHMS(kstClockSec(now)).padStart(8,'0');
    $('syncDesc').textContent = `가상 데이터 · ${DEMO_SPEED}배속 진행 중`;
    return;
  }
  const preRace = now < FIRST_START_MS - 30*60000;
  const afterRace = now > LAST_START_MS + 6.5*3600000;
  if(!p || !p.updated_epoch){
    dot.classList.add(preRace ? 'idle' : 'stale');
    $('syncTop').textContent = preRace ? '레이스 시작 전' : '기록 대기 중';
    $('syncFoot').textContent = '--:--:--';
    $('syncDesc').textContent = preRace ? '08:30부터 실시간 갱신' : '첫 기록을 기다리는 중';
    return;
  }
  const ageMin = Math.floor((Date.now()/1000 - p.updated_epoch) / 60);
  const ageTxt = ageMin < 1 ? '방금' : `${ageMin}분 전`;
  $('syncTop').textContent = UI_PLUS ? `${ageTxt} 갱신` : `${p.updated_at || '--:--'} · ${ageTxt}`;
  $('syncFoot').textContent = p.updated_at || '--:--:--';
  if(preRace){ dot.classList.add('idle'); $('syncDesc').textContent = '레이스 시작 전 · 08:30부터 실시간 갱신'; return; }
  if(afterRace){ dot.classList.add('idle'); $('syncDesc').textContent = '추적 종료 · 최종 기록'; return; }
  if(p.ok_count === 0){ dot.classList.add('stale'); $('syncDesc').innerHTML = '<span class="bad">기록 사이트 응답 없음 · 이전 기록 표시</span>'; return; }
  if(ageMin >= 5){ dot.classList.add('stale'); $('syncDesc').innerHTML = `<span class="bad">${ageMin}분째 갱신 없음</span>`; return; }
  $('syncDesc').textContent = `${p.ok_count}/${p.total}명 확인 · 자동 갱신`;
}
function renderClock(){
  if(!UI_PLUS) return;
  const d = nowMs() - FIRST_START_MS;
  $('raceClock').textContent = d >= 0 && d < 9*3600000 ? `· 레이스 ${fmtHMS(d/1000)}` : '';
}
function render(){
  try{ renderStats(); renderFocus(); renderList(); renderSync(); renderClock(); drawMarkers(); }
  catch(err){ console.error('render', err); }
}

/* ═════════════ 데이터 불러오기 ═════════════
   1순위: 이 사이트(GitHub Pages)의 data.json — 접속자가 많아도 안전
   2순위: 기록이 3분 넘게 오래됐으면 GitHub 원본에서 직접 확인 */
function detectRepo(){
  if(CONFIG.GITHUB_OWNER && CONFIG.GITHUB_REPO) return { owner:CONFIG.GITHUB_OWNER, repo:CONFIG.GITHUB_REPO };
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
  if(!m) return null;
  const seg = location.pathname.split('/').filter(Boolean)[0];
  return { owner:m[1], repo: seg && !seg.includes('.') ? seg : `${m[1]}.github.io` };
}
const REPO = detectRepo();
let apiBlockedUntil = 0;
function withTimeout(promise, ms){
  return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
}
function decodeB64Utf8(b64){
  const bin = atob(String(b64).replace(/\s/g, ''));
  return new TextDecoder('utf-8').decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
async function fromSite(){
  const res = await fetch(`./data.json?t=${Date.now()}`, { cache:'no-store' });
  if(!res.ok) throw new Error(res.status);
  return res.json();
}
async function fromApi(){
  if(!REPO || Date.now() < apiBlockedUntil) throw new Error('skip');
  const res = await fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.repo}/contents/data.json?ref=${CONFIG.DATA_BRANCH}`, { cache:'no-cache' });
  if(res.status === 403 || res.status === 429){ apiBlockedUntil = Date.now() + 10*60000; throw new Error('rate'); }
  if(!res.ok) throw new Error(res.status);
  const j = await res.json();
  return JSON.parse(decodeB64Utf8(j.content));
}
async function fromRaw(){
  if(!REPO) throw new Error('skip');
  const res = await fetch(`https://raw.githubusercontent.com/${REPO.owner}/${REPO.repo}/${CONFIG.DATA_BRANCH}/data.json?t=${Date.now()}`, { cache:'no-store' });
  if(!res.ok) throw new Error(res.status);
  return res.json();
}
function normalize(j){
  if(Array.isArray(j)) j = { runners:j };
  if(!j || typeof j !== 'object' || !Array.isArray(j.runners)) return null;
  j.updated_epoch = Number(j.updated_epoch) || 0;
  return j;
}
function newest(list){ return list.filter(Boolean).sort((a, b) => b.updated_epoch - a.updated_epoch)[0] || null; }
function applyPayload(p){
  if(lastPayload && p.updated_epoch < lastPayload.updated_epoch) return;
  lastPayload = p;
}
/* 수동 보정(admin.html 에서 저장한 manual.json)을 자동 기록 위에 덮어씀
   - 보정 거리가 자동 기록보다 앞서 있을 때만 적용 → 자동 기록이 따라잡으면 자연스럽게 자동으로 복귀
   - '강제 적용'이면 자동 기록보다 작아도 적용 (잘못 튄 기록 바로잡기용) */
let manualData = null;
function rebuild(){
  const p = lastPayload;
  const byBib = new Map((p && p.runners || []).filter(r => r && r.bib != null).map(r => [String(r.bib), r]));
  const man = (manualData && manualData.runners && typeof manualData.runners === 'object') ? manualData.runners : {};
  runners = ROSTER.map(base => {
    const d = byBib.get(base.bib) || {};
    const r = { ...base, ...d, name: base.name, bib: base.bib, group: base.group, order: base.order,
                km: Number(d.km) || 0, started: !!d.started, manual: false };
    const m = man[base.bib];
    if(m && m.km != null && isFinite(Number(m.km))){
      const mk = Math.max(0, Math.min(FULL, Number(m.km)));
      if(m.force || mk > r.km || (mk === 0 && !r.started)){
        r.km = mk; r.started = true; r.manual = true;
        r.point = m.point || cpName(mk);
        if(m.pass_time) r.pass_time = m.pass_time;
        r.net_time = m.net_time || (m.force ? null : r.net_time);
        if(mk === 0 && m.pass_time) r.start_time = m.pass_time;
        const sp = (Array.isArray(r.splits) ? r.splits : []).filter(s => s && (m.force ? Number(s.km) < mk : true) && Math.abs(Number(s.km) - mk) > 0.001);
        if(mk > 0) sp.push({ km: mk, label: r.point, pass: m.pass_time || null, net: m.net_time || null });
        r.splits = sp.sort((a, b) => a.km - b.km);
      }
    }
    return r;
  });
  const notice = manualData && typeof manualData.notice === 'string' ? manualData.notice.trim() : '';
  $('notice').textContent = notice ? `📢 ${notice}` : '';
  $('notice').classList.toggle('show', !!notice);
}
async function fromManual(){
  const res = await fetch(`./manual.json?t=${Date.now()}`, { cache:'no-store' });
  if(res.status === 404) return {};
  if(!res.ok) throw new Error(res.status);
  return res.json();
}

/* 데모: 실제처럼 움직이는 가상 데이터 (주소 끝에 ?demo) */
function demoPayload(){
  const now = kstClockSec(nowMs());
  return { updated_at: fmtHMS(now).padStart(8,'0'), updated_epoch: Math.floor(Date.now()/1000), ok_count: ROSTER.length, total: ROSTER.length,
    runners: ROSTER.map((r, i) => {
      const gStart = kstClockSec(groupStartMs(r.group));
      const delay = 30 + (i % 3) * 40, pace = 255 + ((i * 37) % 170);
      const t0 = gStart + delay, run = now - t0;
      if(run < 0 || i === 3) return { ...r, km: 0, started: false };
      const dist = run / pace;
      const passed = [0, ...CHECKPOINTS].filter(c => c <= dist + 1e-9);
      const km = passed[passed.length-1] ?? 0;
      const splits = passed.filter(c => c > 0).map(c => ({ km:c, label:cpName(c), pass: fmtHMS(t0 + c*pace).padStart(8,'0'), net: fmtHMS(c*pace) }));
      return { ...r, km, started: true, start_time: fmtHMS(t0).padStart(8,'0'), point: cpName(km),
               pass_time: fmtHMS(t0 + km*pace).padStart(8,'0'), net_time: km ? fmtHMS(km*pace) : null, splits };
    }) };
}

async function refresh(manual = false){
  if(fetching) return;
  fetching = true;
  const btn = $('refreshBtn'); btn.classList.add('spinning');
  try{
    let p = null;
    if(DEMO) p = demoPayload();
    else {
      const man = await withTimeout(fromManual(), 6000).catch(() => undefined);
      if(man !== undefined) manualData = man && typeof man === 'object' ? man : {};
      const site = await withTimeout(fromSite(), 8000).then(normalize).catch(() => null);
      const fresh = site && (Date.now()/1000 - site.updated_epoch) < 180;
      if(fresh) p = site;
      else {
        const extra = await Promise.all([
          withTimeout(fromApi(), 8000).then(normalize).catch(() => null),
          withTimeout(fromRaw(), 8000).then(normalize).catch(() => null),
        ]);
        p = newest([site, ...extra]);
      }
    }
    if(p) applyPayload(p);
    else if(manual) toast('새 기록을 불러오지 못했어요');
    rebuild();
    checkFinishers();
  } catch(err){ console.error('refresh', err); }
  finally {
    render();
    if(following){ const ll = selectedLatLng(); if(ll) focusOn(ll); }
    setTimeout(() => btn.classList.remove('spinning'), 350);
    fetching = false;
  }
}
$('refreshBtn').addEventListener('click', () => refresh(true));

/* ═════════════ 응원 채팅 (ntfy.sh 실시간 중계) ═════════════
   - 서버 설치 없이 무료 공개 중계(ntfy.sh)로 메시지를 주고받음. 메시지는 12시간 뒤 자동 삭제
   - 실시간 연결이 막히면 5초마다 새 메시지를 확인하는 방식으로 자동 전환
   - 채팅이 안 되더라도 트래커 기능에는 영향 없음 */
const Chat = (() => {
  const TOPIC = CONFIG.CHAT_TOPIC + (DEMO ? '-demo' : '');
  const BASE = `https://ntfy.sh/${encodeURIComponent(TOPIC)}`;
  const QUICK = ['🔥 화이팅!', '👏 대단해요', '💪 힘내요', '🏃 거의 다 왔어요!', '🎉 완주 축하해요!', '💧 물 꼭 챙겨요'];
  const seen = new Set();               // 중복 방지 (ntfy id)
  const pendings = new Map();           // 내가 보낸 메시지(확인 전)
  let nick = store.get('gsrc_nick', '');
  let lastSeen = store.get('gsrc_chat_seen', 0);
  if(!lastSeen){ lastSeen = Math.floor(Date.now()/1000); store.set('gsrc_chat_seen', lastSeen); }
  let isOpen = false, unread = 0, es = null, esFails = 0, opened = false, pollTimer = null, lastTime = 0, lastSend = 0;
  const clientId = store.get('gsrc_cid', '') || (() => { const id = Math.random().toString(36).slice(2, 10); store.set('gsrc_cid', id); return id; })();   // 새로고침해도 내 메시지는 오른쪽에
  const msgs = $('chatMsgs');

  function setState(on, text){ $('chatDot').classList.toggle('on', !!on); $('chatState').textContent = text; }
  function hhmm(sec){ const d = new Date(sec*1000 + 9*3600000); return d.toISOString().slice(11,16); }
  function badge(){ const b = $('chatBadge'); b.textContent = unread > 99 ? '99+' : unread; b.classList.toggle('show', unread > 0 && !isOpen); }
  function nearBottom(){ return msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 120; }
  function emptyNote(){
    if(!msgs.querySelector('.msg')) msgs.innerHTML = `<div class="chat-empty">아직 메시지가 없어요<br>첫 응원을 남겨보세요 🏃‍♀️</div>`;
  }
  function addMsg(m, { pending = false } = {}){
    msgs.querySelector('.chat-empty')?.remove();
    const mine = !!m.c && String(m.c).startsWith(clientId);
    const el = document.createElement('div');
    el.className = `msg${mine ? ' me' : ''}${pending ? ' pending' : ''}`;
    el.innerHTML = `<span class="mn">${esc(m.n)}</span><span class="mb">${esc(m.t)}</span><span class="mt">${hhmm(m.time)}</span>`;
    const stick = nearBottom() || mine;
    msgs.appendChild(el);
    while(msgs.children.length > 300) msgs.firstElementChild.remove();
    if(stick) msgs.scrollTop = msgs.scrollHeight;
    return el;
  }
  function onEvent(d){
    if(!d || d.event !== 'message' || !d.id || seen.has(d.id)) return;
    seen.add(d.id);
    let m;
    try{ m = JSON.parse(d.message); }catch(_){ return; }
    if(!m || typeof m.t !== 'string' || typeof m.n !== 'string') return;
    m = { n: m.n.slice(0, 12), t: m.t.slice(0, 200), c: m.c, time: d.time || Math.floor(Date.now()/1000) };
    lastTime = Math.max(lastTime, m.time);
    if(m.c && pendings.has(m.c)){ const el = pendings.get(m.c); pendings.delete(m.c); el.classList.remove('pending'); return; }
    addMsg(m);
    if(!isOpen && m.time > lastSeen && !String(m.c || '').startsWith(clientId)){ unread++; badge(); }
  }
  /* 실시간 연결 (Server-Sent Events) */
  function connect(){
    if(es) es.close();
    try{ es = new EventSource(`${BASE}/sse?since=${lastTime ? lastTime : '12h'}`); }
    catch(_){ return startPolling(); }
    es.onopen = () => { esFails = 0; setState(true, '실시간 연결됨'); };
    es.onmessage = e => { try{ onEvent(JSON.parse(e.data)); }catch(_){} };
    es.onerror = () => {
      esFails++;
      setState(false, '다시 연결 중…');
      const closed = !es || es.readyState === 2;          // 2 = 브라우저가 재시도를 포기한 상태
      if(esFails >= 3 || (closed && esFails >= 2)){ if(es) es.close(); es = null; startPolling(); }
      else if(closed){ setTimeout(connect, 3000); }
    };
  }
  /* 실시간 연결이 막힌 환경(일부 회사·통신망)용: 5초마다 확인 */
  async function poll(){
    try{
      const res = await fetch(`${BASE}/json?poll=1&since=${lastTime ? lastTime : '12h'}`, { cache:'no-store' });
      if(!res.ok) throw new Error(res.status);
      (await res.text()).split('\n').forEach(line => { if(line.trim()){ try{ onEvent(JSON.parse(line)); }catch(_){} } });
      setState(true, '연결됨 (5초마다 확인)');
    }catch(_){ setState(false, '연결이 불안정해요'); }
  }
  function startPolling(){ if(pollTimer) return; poll(); pollTimer = setInterval(() => { if(!document.hidden || isOpen) poll(); }, 5000); }

  async function send(text){
    text = String(text || '').trim().slice(0, 200);
    if(!text || !nick) return;
    if(Date.now() - lastSend < 1500){ toast('조금 천천히 보내주세요'); return; }
    lastSend = Date.now();
    const c = clientId + '-' + Date.now().toString(36);
    const body = JSON.stringify({ n: nick, t: text, c });
    const el = addMsg({ n: nick, t: text, c: clientId, time: Math.floor(Date.now()/1000) }, { pending: true });
    pendings.set(c, el);
    try{
      const res = await fetch(BASE, { method:'POST', body });
      if(!res.ok) throw new Error(res.status);
      if(pollTimer) setTimeout(poll, 400);
      setTimeout(() => { if(pendings.has(c)){ pendings.delete(c); el.classList.remove('pending'); } }, 8000);
    }catch(err){
      pendings.delete(c); el.remove(); emptyNote();
      toast(err && err.message === '429' ? '메시지가 너무 많아요. 잠시 후 다시 보내주세요' : '전송에 실패했어요. 다시 시도해주세요');
    }
  }

  function showGate(on){
    $('chatGate').hidden = !on; $('chatMsgs').hidden = on; $('chatBottom').hidden = on;
    $('chatGate').style.display = on ? '' : 'none';
    if(on) setTimeout(() => $('nickInput').focus(), 300);
  }
  function setNick(v){
    v = String(v || '').replace(/\s+/g, ' ').trim().slice(0, 12);
    if(!v){ toast('닉네임을 입력해주세요'); return false; }
    nick = v; store.set('gsrc_nick', nick); $('chatNick').textContent = nick;
    return true;
  }
  function open(){
    isOpen = true; $('chat').classList.add('open');
    unread = 0; badge();
    lastSeen = Math.floor(Date.now()/1000); store.set('gsrc_chat_seen', lastSeen);
    if(!opened){ opened = true; if(!es && !pollTimer) connect(); }
    if(!nick) showGate(true);
    else { showGate(false); msgs.scrollTop = msgs.scrollHeight; }
  }
  function close(){
    isOpen = false; $('chat').classList.remove('open');
    lastSeen = Math.floor(Date.now()/1000); store.set('gsrc_chat_seen', lastSeen);
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
  }

  $('chatQuick').innerHTML = QUICK.map(q => `<button>${q}</button>`).join('');
  $('chatQuick').addEventListener('click', e => { const b = e.target.closest('button'); if(b) send(b.textContent); });
  $('chatFab').addEventListener('click', open);
  $('chatClose').addEventListener('click', close);
  $('chatNick').addEventListener('click', () => { $('nickInput').value = nick; showGate(true); });
  $('nickSave').addEventListener('click', () => { if(setNick($('nickInput').value)){ showGate(false); msgs.scrollTop = msgs.scrollHeight; } });
  $('nickInput').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.isComposing) $('nickSave').click(); });
  $('chatSend').addEventListener('click', () => { const v = $('chatText').value; $('chatText').value = ''; send(v); $('chatText').focus(); });
  $('chatText').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); $('chatSend').click(); } });
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && isOpen) close(); });
  $('chatNick').textContent = nick || '닉네임';
  emptyNote();
  /* 페이지가 뜬 뒤 조용히 연결 (트래커 로딩을 방해하지 않게) */
  setTimeout(connect, 2500);
  return { open, close, send, _onEvent: onEvent };
})();

/* ═════════════ 시작 ═════════════ */
render();
requestAnimationFrame(() => { setSnap('half'); fitCourse(false); });
refresh().then(() => {
  const bib = QS.get('bib');
  if(UI_PLUS && bib && runners.some(r => r.bib === bib)) setTimeout(() => selectRunner(bib), 400);
});
setInterval(() => { if(!document.hidden) refresh(); }, DEMO ? 3000 : CONFIG.POLL_MS);
setInterval(() => { render(); if(following){ const ll = selectedLatLng(); if(ll) focusOn(ll); } }, 20000);
setInterval(() => {
  const byBib = new Map(runners.map(r => [String(r.bib), r]));
  document.querySelectorAll('[data-tick]').forEach(el => { const r = byBib.get(el.dataset.tick); if(r) el.innerHTML = tickText(r); });
  const sel = byBib.get(selectedBib);
  if(sel && status(sel) === 'running'){ const el = elapsedOf(sel); if(el) $('fNet').textContent = fmtHMS(el.sec); }
  renderClock();
}, 1000);
/* 각 조 출발 순간에 화면 전환 + 알림 */
GROUPS.forEach(g => {
  const wait = groupStartMs(g) - nowMs();
  if(!DEMO && wait > 0 && wait < 864e5) setTimeout(() => { render(); toast(`${g}조 출발! 🏃`); }, wait + 300);
});
document.addEventListener('visibilitychange', () => { if(!document.hidden){ refresh(); setTimeout(refitIfIdle, 150); } });
window.addEventListener('load', () => setTimeout(refitIfIdle, 200));
setTimeout(refitIfIdle, 1500);
</script>
